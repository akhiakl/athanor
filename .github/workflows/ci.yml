name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify:
    name: Typecheck & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: akhiakl/ci-workflows@v1.4.0
        id: typecheck
        continue-on-error: true
        with:
          name: typecheck
          run: pnpm run typecheck

      - uses: akhiakl/ci-workflows@v1.4.0
        id: test
        continue-on-error: true
        with:
          name: test
          run: pnpm run test

      - name: Upload check results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-node-${{ matrix.node-version }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if any check failed
        if: steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1

  quality-gate:
    name: Quality Gate
    needs: [verify]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: akhiakl/ci-workflows/gate@v1.4.0
        with:
          marker: '<!-- athanor-quality-gate -->'
          title: Quality Gate
          status: |
            Typecheck & Test (Node 22 & 24)=${{ needs.verify.result }}

      - name: Fail if verify failed
        if: needs.verify.result != 'success'
        run: exit 1
