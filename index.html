<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Athanor</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141418" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Viewport lock, spec 6.3 */
      html, body { margin: 0; }
      html.editor, html.editor body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: #fff; }
      #stage, #hud { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      input, textarea { user-select: text; -webkit-user-select: text; }
      #stage { position: fixed; inset: 0; touch-action: none; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #guides { pointer-events: none; }
      button { touch-action: manipulation; }
      /* Settings > Interface > Reduced motion */
      html[data-motion='reduce'] *, html[data-motion='reduce'] *::before, html[data-motion='reduce'] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="stage" hidden>
      <canvas id="committed"></canvas>
      <canvas id="active"></canvas>
      <canvas id="guides"></canvas>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
